<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Test Blog</title>
        <link rel="stylesheet" href="{{root}}style.css" />
    </head>
    <body>
        <header>
            <a href="{{root}}">Home</a>
            •
            <a id="blog-link" href="{{root}}blog/">Blog</a>
        </header>

        <main>
            <h1>Posts</h1>
            <ul>
                <li><a href="./post-a/">An Interactive Grid</a></li>
                <li><a href="./post-b/">Two Small Demos</a></li>
                <li><a href="./post-c/">Plain Markdown Post</a></li>
            </ul>
        </main>

        <script>
            const main = document.querySelector("main");
            const isPostPage = new URL(".", location.href).href !== document.querySelector("#blog-link").href;

            if (isPostPage) {
                main.textContent = "Loading article...";
                renderPost();
            }

            async function renderPost() {
                const { marked } = await import("https://cdn.jsdelivr.net/npm/marked@18.1.0/lib/marked.esm.js");
                const response = await fetch("./index.md");

                if (!response.ok) {
                    throw new Error(`Failed to load Markdown: ${response.status}`);
                }

                main.innerHTML = marked.parse(await response.text());

                const heading = main.querySelector("h1");
                if (heading) {
                    document.title = `${heading.textContent} — ${document.title}`;
                }
            }
        </script>
    </body>
</html>
